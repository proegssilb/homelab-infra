# Build, test and publish the bootc template image (docs/specs/2026-11-22-bootc-migration.md).
#
# On runner01: jobs get the host's Docker socket, so the privileged pieces
# (bootc-image-builder, the KVM boot test) run as sibling containers and share
# data through named Docker volumes, never host paths.
#
# main  -> bootc-base:<sha12> + :candidate; disk image; boot test; upgrade test from
#          :canary; only if both pass: disk published as a generic package and the image
#          retagged :canary. (:stable is promoted by hand until the promotion job exists.)
# other -> bootc-base:branch-<sha12>; same tests (upgrading from the newest earlier disk
#          when there's no canary); disk published if they pass; never candidate/canary.
#          Any branch push touching the image runs it: Forgejo only lists (and offers
#          "Run workflow" for) workflows on the default branch, so dispatch can't reach
#          a workflow that exists only on a branch.
#
# Auth: secrets.PACKAGE_TOKEN, a Forgejo access token of the repo owner with only the
# package scope (copy in Bitwarden: forgejo/actions-package-token). The automatic
# Actions token can log in to the registry but is refused on push (401 on blob upload).
name: bootc-base

on:
  push:
    branches: ["**"]
    paths:
      - images/bootc-base/**
      - images/bootc-test/**
      - .forgejo/workflows/bootc-base.yml
  schedule:
    - cron: "17 4 * * 1"   # weekly: pick up Fedora updates without a repo change
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BIB: quay.io/centos-bootc/bootc-image-builder:latest
      PODMAN: quay.io/podman/stable:latest
    steps:
      - uses: actions/checkout@v4

      - name: Names and tags
        id: n
        run: |
          host="${GITHUB_SERVER_URL#https://}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="${GITHUB_SHA::12}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tag="$short"; main=1; else tag="branch-$short"; main=0; fi
          {
            echo "host=$host"; echo "owner=$owner"; echo "tag=$tag"; echo "main=$main"
            echo "image=$host/$owner/bootc-base"
            echo "tester=$host/$owner/bootc-test"
            echo "pkg=$GITHUB_SERVER_URL/api/packages/$owner/generic/bootc-base-disk"
            echo "vol=bootc-${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Registry login
        run: echo "${{ secrets.PACKAGE_TOKEN }}" | docker login "${{ steps.n.outputs.host }}" -u "${{ steps.n.outputs.owner }}" --password-stdin

      # Build and push in one BuildKit export (like anamnesis's release workflow). A
      # separate `docker push` spends minutes compressing bootc's large layers before
      # its first upload, by which time proxy01 has closed the idle keep-alive
      # connection ("server closed idle connection"), and it doesn't retry. Retries
      # here are cheap: the rebuild comes from cache. --provenance=false keeps a plain
      # image manifest (no attestation index) for bootc and bootc-image-builder.
      - name: Build and push the image
        id: build
        run: |
          set -euo pipefail
          ref="${{ steps.n.outputs.image }}:${{ steps.n.outputs.tag }}"
          for attempt in 1 2 3; do
            if docker buildx build --pull --push --provenance=false --metadata-file meta.json \
                 --build-arg VERSION="${{ steps.n.outputs.tag }}" \
                 --build-arg REVISION="$GITHUB_SHA" \
                 --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                 -t "$ref" -f images/bootc-base/Containerfile images/bootc-base; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::build/push attempt $attempt failed; retrying"; sleep 15
          done
          digest=$(python3 -c 'import json; print(json.load(open("meta.json"))["containerimage.digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.n.outputs.main }}" = 1 ]; then
            docker buildx imagetools create -t "${{ steps.n.outputs.image }}:candidate" \
              "${{ steps.n.outputs.image }}@$digest"
          fi

      - name: Build and push the test runner
        run: |
          set -euo pipefail
          ref="${{ steps.n.outputs.tester }}:${{ steps.n.outputs.tag }}"
          for attempt in 1 2 3; do
            docker buildx build --pull --push --provenance=false \
              -t "$ref" -f images/bootc-test/Containerfile images/bootc-base && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::build/push attempt $attempt failed; retrying"; sleep 15
          done

      - name: Disk image (bootc-image-builder)
        run: |
          set -euo pipefail
          v="${{ steps.n.outputs.vol }}"
          src="${{ steps.n.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker volume create "$v-store" >/dev/null
          docker volume create "$v-out" >/dev/null
          # BIB builds from containers-storage; fill it with podman first.
          docker run --rm --privileged -v "$v-store:/var/lib/containers/storage" "$PODMAN" \
            podman pull -q "$src"
          # BIB runs the image under its own podman to read it; inside Docker's private
          # cgroup namespace that nested podman can't set up cgroups ("controller
          # `pids` is not available"), so share the host's.
          docker run --rm --privileged --cgroupns=host \
            -v "$v-store:/var/lib/containers/storage" -v "$v-out:/output" \
            "$BIB" --type qcow2 --rootfs xfs "$src"

      - name: Boot test
        run: |
          docker run --rm --device /dev/kvm -v "${{ steps.n.outputs.vol }}-out:/work:ro" \
            "${{ steps.n.outputs.tester }}:${{ steps.n.outputs.tag }}" \
            /work/qcow2/disk.qcow2 --expect-digest "${{ steps.build.outputs.digest }}"

      # Upgrade from what VMs run now (:canary). Branches have no canary of their own,
      # so when none exists they upgrade from the newest earlier disk package instead.
      - name: Upgrade test
        run: |
          set -euo pipefail
          image="${{ steps.n.outputs.image }}"
          base=""
          if rev=$(docker buildx imagetools inspect "$image:canary" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null) && [ -n "$rev" ]; then
            base="${rev::12}"; echo "upgrading from :canary ($base)"
          elif [ "${{ steps.n.outputs.main }}" != 1 ]; then
            base=$(curl -fsS "$GITHUB_SERVER_URL/api/v1/packages/${{ steps.n.outputs.owner }}?type=generic&q=bootc-base-disk&limit=50" \
              | python3 -c 'import json, sys
          cur = sys.argv[1]
          old = sorted((p for p in json.load(sys.stdin) if p["name"] == "bootc-base-disk" and p["version"] != cur),
                       key=lambda p: p["created_at"])
          print(old[-1]["version"] if old else "")' "${{ steps.n.outputs.tag }}")
            [ -n "$base" ] && echo "no :canary; upgrading from the newest earlier disk ($base)"
          fi
          if [ -z "$base" ]; then
            echo "::notice::nothing to upgrade from yet; skipping the upgrade test"
            exit 0
          fi
          v="${{ steps.n.outputs.vol }}"
          docker volume create "$v-old" >/dev/null
          docker run --rm -v "$v-old:/old" "$PODMAN" \
            curl -fsS -o /old/disk.qcow2 "${{ steps.n.outputs.pkg }}/$base/bootc-base.qcow2"
          docker run --rm --device /dev/kvm -v "$v-old:/work:ro" \
            "${{ steps.n.outputs.tester }}:${{ steps.n.outputs.tag }}" \
            /work/disk.qcow2 \
            --upgrade-to "$image:${{ steps.n.outputs.tag }}" \
            --upgrade-digest "${{ steps.build.outputs.digest }}"

      # Only after both tests: a broken disk must never become an upgrade base or an
      # install source.
      - name: Publish the disk image
        run: |
          set -euo pipefail
          v="${{ steps.n.outputs.vol }}"
          c=$(docker create -v "$v-out:/output" "$PODMAN" true)
          docker cp "$c:/output/qcow2/disk.qcow2" ./bootc-base.qcow2
          docker rm "$c" >/dev/null
          curl -fsS --user "${{ steps.n.outputs.owner }}:${{ secrets.PACKAGE_TOKEN }}" \
            --upload-file ./bootc-base.qcow2 \
            "${{ steps.n.outputs.pkg }}/${{ steps.n.outputs.tag }}/bootc-base.qcow2"
          rm -f ./bootc-base.qcow2

      - name: Tag canary
        if: steps.n.outputs.main == '1'
        run: |
          docker buildx imagetools create \
            -t "${{ steps.n.outputs.image }}:canary" \
            "${{ steps.n.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Clean up volumes
        if: always()
        run: |
          v="${{ steps.n.outputs.vol }}"
          docker volume rm -f "$v-store" "$v-out" "$v-old" >/dev/null 2>&1 || true
