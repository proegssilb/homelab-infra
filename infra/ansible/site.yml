---
# site.yml — apply all roles to their respective host groups.
#
# To add a new role: define roles/<name>/, then add a play here targeting the right group.
# Limit to a host or group at the CLI: ansible-playbook site.yml -l <host-or-group>

# Must stay ahead of the `all` play: every other host's os_baseline points apt
# at this proxy, so it has to be serving first (e.g. during `just cluster-up
# platform` from an empty cluster).
- name: APT caching proxy
  hosts: apt_cache
  become: true
  gather_facts: true
  roles:
    - os_baseline
    - apt_cache

# Proxmox nodes are in the inventory (hypervisors group) but never get the
# baseline; they have their own playbook, hypervisors.yml.
- name: OS baseline + observability agents — all hosts
  hosts: all:!hypervisors
  become: true
  gather_facts: true
  roles:
    - os_baseline
    - node_exporter
    - alloy

- name: Garage — bootstrap node
  hosts: bootstrap
  become: true
  gather_facts: true
  roles:
    - garage

- name: Garage — general-purpose app object storage
  hosts: garage_app
  become: true
  gather_facts: true
  roles:
    - garage

- name: Proxy — nginx reverse proxy + certbot
  hosts: proxy
  become: true
  gather_facts: true
  roles:
    - certbot
    - nginx_reverse_proxy

- name: Loki — log aggregation
  hosts: obs_loki
  become: true
  gather_facts: true
  roles:
    - loki
    - netconsole_relay

- name: Prometheus — metrics + alertmanager
  hosts: obs_prometheus
  become: true
  gather_facts: true
  roles:
    - prometheus
    - alertmanager
    - graphite_exporter
    - blackbox_exporter
    - unpoller

- name: Grafana — dashboards
  hosts: obs_grafana
  become: true
  gather_facts: true
  roles:
    - grafana

- name: Authentik — identity provider
  hosts: auth_app
  become: true
  gather_facts: true
  roles:
    - authentik

- name: Nextcloud — file sync and collaboration
  hosts: nextcloud_app
  become: true
  gather_facts: true
  roles:
    - nextcloud

- name: Forgejo — git forge
  hosts: forgejo_app
  become: true
  gather_facts: true
  roles:
    - forgejo

# After the Forgejo play: the server must know the runner's shared secret
# before the runner first connects (`just bootstrap` from an empty cluster).
- name: Forgejo Actions runner — CI
  hosts: forgejo_runner
  become: true
  gather_facts: true
  roles:
    - forgejo_runner

- name: PostgreSQL — shared database server
  hosts: postgres_primary
  become: true
  gather_facts: true
  roles:
    - postgresql

- name: Actual Budget — personal finance
  hosts: budget_app
  become: true
  gather_facts: true
  roles:
    - actual_budget

- name: Mealie — recipe manager
  hosts: mealie_app
  become: true
  gather_facts: true
  roles:
    - mealie

- name: FreshRSS — RSS aggregator
  hosts: freshrss_app
  become: true
  gather_facts: true
  roles:
    - freshrss

- name: Immich — photo management
  hosts: immich_app
  become: true
  gather_facts: true
  roles:
    - immich

- name: SearXNG — privacy-preserving metasearch
  hosts: searxng_app
  become: true
  gather_facts: true
  roles:
    - searxng

- name: IT Tools — developer utility collection
  hosts: ittools_app
  become: true
  gather_facts: true
  roles:
    - ittools

- name: Anamnesis — task tracker
  hosts: anamnesis_app
  become: true
  gather_facts: true
  roles:
    - anamnesis

- name: Home Assistant — home automation
  hosts: homeassistant_app
  become: true
  gather_facts: true
  roles:
    - homeassistant

- name: Homepage — browser start page
  hosts: homepage_app
  become: true
  gather_facts: true
  roles:
    - homepage

- name: Coder — remote dev environments (demo)
  hosts: coder_app
  become: true
  gather_facts: true
  roles:
    - coder

- name: Egress proxy — mitmproxy for Coder workspaces (agentsvc VLAN)
  hosts: egress_proxy
  become: true
  gather_facts: true
  roles:
    - egress_proxy

- name: NTP server — time for Coder workspaces (agentsvc VLAN)
  hosts: ntp_server
  become: true
  gather_facts: true
  vars:
    ntp_server_allow:
      - "{{ coder_agents_cidr }}"
  roles:
    - ntp_server

- name: Tailscale subnet routers
  hosts: tailscale_router
  become: true
  gather_facts: true
  roles:
    - tailscale_router
