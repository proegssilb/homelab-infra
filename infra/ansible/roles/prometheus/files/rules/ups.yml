# Managed by Ansible (prometheus role) — do not edit by hand.
#
# Early warnings for the UPSes: network cards (job "ups", snmp_exporter, each
# with its vendor's stock module) and USB UPSes read by NUT (job "ups_nut",
# roles/ups_usb). Every rule matches each metric set that has the value: one
# card MIB's (upsBasic*, upsAdv*), the other's (upsBase*, upsAdvance*), and
# NUT's (network_ups_tools_*).
# severity=warning: Alertmanager sends these nowhere; they show in Prometheus
# (/alerts) and Alertmanager's UI. Outages and low battery are critical
# (fire.yml, fire-ups).
groups:
  - name: ups
    rules:
      # Card not answering SNMPv3 (wrong credentials, card rebooting,
      # firewall), or NUT lost the USB UPS (upsd reports stale data, so the
      # exporter fails). Nothing else watches the UPSes.
      - alert: UpsUnreachable
        expr: up{job=~"ups|ups_nut"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "UPS {{ $labels.instance }} unreadable for 10 minutes"

      # Any time on battery. Becomes UpsOnBatteryProlonged (critical) at 5 minutes.
      - alert: UpsOnBattery
        expr: |
          (upsBasicOutputStatus{job="ups", upsBasicOutputStatus="onBattery"} == 1)
            or (upsBaseOutputStatus{job="ups"} == 3)
            or (network_ups_tools_ups_status{job="ups_nut", flag="OB"} == 1)
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} running on battery"

      - alert: UpsBatteryNeedsReplacing
        expr: |
          (upsAdvBattery_needsreplacing{job="ups"} == 1)
            or (upsAdvanceBatteryReplaceIndicator{job="ups"} == 2)
            or (network_ups_tools_ups_status{job="ups_nut", flag="RB"} == 1)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} reports its battery needs replacing"

      # upsAdvanceTestDiagnosticsResults: 1 ok, 2 failed.
      - alert: UpsSelfTestFailed
        expr: |
          (upsAdvTestDiagnosticsResults_info{job="ups", upsAdvTestDiagnosticsResults="failed"} == 1)
            or (upsAdvanceTestDiagnosticsResults{job="ups"} == 2)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} failed its last self-test"

      # upsStatus (upsBase*/upsAdvance* card MIB): 1 normal, 2 overheat,
      # 3 hardware fault.
      - alert: UpsHardwareFault
        expr: upsStatus{job="ups"} > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} reports overheat or a hardware fault (upsStatus {{ $value }})"

      # Little headroom left: runtime drops and an overload trips the output.
      - alert: UpsLoadHigh
        expr: |
          (upsAdvOutputLoad{job="ups"} > 80)
            or (upsAdvanceOutputLoad{job="ups"} > 80)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} output load {{ $value }}%"
