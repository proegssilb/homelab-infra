# Managed by Ansible (prometheus role) — do not edit by hand.
#
# Alerts for the Proxmox nodes and Ceph (data from hypervisors.yml). Nothing is
# routed yet (Alertmanager's receiver is 'null'): these show as pending/firing
# in Prometheus (/alerts) and Alertmanager until an alerting plan exists.
groups:
  - name: hypervisors
    rules:
      # Each node's conntrack table is shared by every guest on it (bridged
      # traffic is tracked). A full table breaks new connections for all of
      # them, e.g. when one workspace floods connections.
      - alert: HypervisorConntrackFilling
        expr: node_nf_conntrack_entries{job="hypervisors"} / node_nf_conntrack_entries_limit{job="hypervisors"} > 0.75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} conntrack table {{ $value | humanizePercentage }} full"

      - alert: HypervisorConntrackNearlyFull
        expr: node_nf_conntrack_entries{job="hypervisors"} / node_nf_conntrack_entries_limit{job="hypervisors"} > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} conntrack table {{ $value | humanizePercentage }} full; new connections for its guests will fail soon"

      - alert: HypervisorExporterDown
        expr: up{job="hypervisors"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node_exporter on {{ $labels.instance }} not reachable (node down, or exporter stopped)"

  - name: ceph
    rules:
      # ceph_health_status: 0 OK, 1 WARN, 2 ERR.
      - alert: CephHealthWarning
        expr: max(ceph_health_status) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ceph health is HEALTH_WARN"

      - alert: CephHealthError
        expr: max(ceph_health_status) == 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ceph health is HEALTH_ERR"

      # The active mgr serves the metrics; none at all means no mgr exporter.
      - alert: CephMetricsMissing
        expr: absent(ceph_health_status)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No Ceph metrics (no active mgr serving the Prometheus module)"
