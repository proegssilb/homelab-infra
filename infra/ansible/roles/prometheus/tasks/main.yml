---
- name: Remove Debian prometheus package
  ansible.builtin.apt:
    name: prometheus
    state: absent

- name: Create prometheus system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    home: "{{ prometheus_data_dir }}"
    create_home: false

- name: Check if data disk is already mounted
  ansible.builtin.command:
    cmd: mountpoint -q {{ prometheus_data_dir }}
  register: _data_mounted
  failed_when: false
  changed_when: false

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ prometheus_data_disk }}"

- name: Mount prometheus data disk
  ansible.posix.mount:
    path: "{{ prometheus_data_dir }}"
    src: "{{ prometheus_data_disk }}"
    fstype: ext4
    state: mounted
    opts: defaults,noatime

- name: Set ownership on data directory after mount
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0750"

- name: Create prometheus config directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: root
    group: prometheus
    mode: "0750"

- name: Create prometheus targets directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/targets"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0750"

- name: Create static targets file
  ansible.builtin.copy:
    content: "[]  # Add static scrape targets here\n"
    dest: "{{ prometheus_config_dir }}/targets/static.yml"
    owner: root
    group: prometheus
    mode: "0640"
    force: false

- name: Download prometheus archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    mode: "0644"

- name: Extract prometheus archive
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/"

- name: Install prometheus binary
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"
    dest: "{{ prometheus_install_dir }}/prometheus"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart prometheus

- name: Install promtool binary
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/promtool"
    dest: "{{ prometheus_install_dir }}/promtool"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Template prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: prometheus
    mode: "0640"
  notify: Restart prometheus

- name: Install prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart prometheus

- name: Install proxmox SD script
  ansible.builtin.template:
    src: proxmox_sd.py.j2
    dest: /usr/local/bin/prometheus-proxmox-sd
    owner: root
    group: root
    mode: "0755"

- name: Install proxmox SD systemd service
  ansible.builtin.template:
    src: prometheus-proxmox-sd.service.j2
    dest: /etc/systemd/system/prometheus-proxmox-sd.service
    owner: root
    group: root
    mode: "0644"

- name: Install proxmox SD systemd timer
  ansible.builtin.template:
    src: prometheus-proxmox-sd.timer.j2
    dest: /etc/systemd/system/prometheus-proxmox-sd.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start proxmox SD timer
  ansible.builtin.systemd:
    name: prometheus-proxmox-sd.timer
    enabled: true
    state: started
    daemon_reload: true
