---
- name: Install Docker
  ansible.builtin.import_role:
    name: docker_install

- name: Create config directory
  ansible.builtin.file:
    path: "{{ homepage_data_dir }}/config"
    state: directory
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homepage_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart homepage

# bookmarks.yaml is templated empty because Homepage seeds a missing one with
# sample bookmarks (GitHub, Reddit, YouTube).
- name: Template Homepage config
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ homepage_data_dir }}/config/{{ item }}"
    mode: "0640"
  loop:
    - settings.yaml
    - services.yaml
    - widgets.yaml
    - bookmarks.yaml
  notify: Restart homepage

- name: Pull Homepage image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ homepage_data_dir }}"

- name: Start Homepage stack
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_data_dir }}"
    state: present
