---
- name: Create graphite_exporter system user
  ansible.builtin.user:
    name: graphite_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download graphite_exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/graphite_exporter/releases/download/v{{ graphite_exporter_version }}/graphite_exporter-{{ graphite_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/graphite_exporter-{{ graphite_exporter_version }}.linux-amd64.tar.gz"
    mode: "0644"

- name: Extract graphite_exporter archive
  ansible.builtin.unarchive:
    src: "/tmp/graphite_exporter-{{ graphite_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/graphite_exporter-{{ graphite_exporter_version }}.linux-amd64/"

- name: Install graphite_exporter binary
  ansible.builtin.copy:
    src: "/tmp/graphite_exporter-{{ graphite_exporter_version }}.linux-amd64/graphite_exporter"
    dest: "{{ graphite_exporter_install_dir }}/graphite_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart graphite_exporter

- name: Install graphite_exporter systemd unit
  ansible.builtin.template:
    src: graphite_exporter.service.j2
    dest: /etc/systemd/system/graphite_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart graphite_exporter

- name: Enable and start graphite_exporter
  ansible.builtin.systemd:
    name: graphite_exporter
    enabled: true
    state: started
    daemon_reload: true
