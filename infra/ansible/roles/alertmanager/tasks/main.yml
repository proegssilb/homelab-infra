---
- name: Create alertmanager system user
  ansible.builtin.user:
    name: alertmanager
    system: true
    shell: /usr/sbin/nologin
    home: "{{ alertmanager_data_dir }}"
    create_home: false

- name: Create alertmanager config directory
  ansible.builtin.file:
    path: "{{ alertmanager_config_dir }}"
    state: directory
    owner: root
    group: alertmanager
    mode: "0750"

# Alertmanager writes silences and its notification log here; root-owned, it
# couldn't, so silences vanished and sent fires could repeat on every restart.
- name: Create alertmanager data directory
  ansible.builtin.file:
    path: "{{ alertmanager_data_dir }}"
    state: directory
    owner: alertmanager
    group: alertmanager
    mode: "0750"

- name: Download alertmanager archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    mode: "0644"

- name: Extract alertmanager archive
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/"

- name: Install alertmanager binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"
    dest: "{{ alertmanager_install_dir }}/alertmanager"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart alertmanager

- name: Install amtool binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/amtool"
    dest: "{{ alertmanager_install_dir }}/amtool"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Template alertmanager config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: alertmanager
    mode: "0640"
    # A config Alertmanager rejects never replaces the running one.
    validate: "{{ alertmanager_install_dir }}/amtool check-config %s"
  notify: Restart alertmanager

- name: Install alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart alertmanager

- name: Enable and start alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    enabled: true
    state: started
    daemon_reload: true
