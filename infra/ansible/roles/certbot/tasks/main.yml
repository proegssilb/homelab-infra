---
- name: Install certbot and Cloudflare DNS plugin
  ansible.builtin.package:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present

- name: Create /etc/letsencrypt directory
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Template Cloudflare credentials file
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: "{{ certbot_cloudflare_credentials_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Issue or renew certificate (no-op when cert has >30 days remaining)
  ansible.builtin.command:
    cmd: >
      certbot certonly
      --non-interactive
      --agree-tos
      --email {{ certbot_email }}
      --dns-cloudflare
      --dns-cloudflare-credentials {{ certbot_cloudflare_credentials_path }}
      --cert-name {{ certbot_domains[0] | regex_replace('^\*\.', '') }}
      --keep-until-expiring
      {% for domain in certbot_domains %}-d {{ domain }} {% endfor %}
  changed_when: false

- name: Template certbot systemd service
  ansible.builtin.template:
    src: certbot-renew.service.j2
    dest: /etc/systemd/system/certbot-renew.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Template certbot systemd timer
  ansible.builtin.template:
    src: certbot-renew.timer.j2
    dest: /etc/systemd/system/certbot-renew.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start certbot timer
  ansible.builtin.systemd:
    name: certbot-renew.timer
    enabled: true
    state: started
    daemon_reload: true
