---
# Everything below except the final enable/start task is gated on
# `garage_data_disk is defined` — that var is only set for new-style Garage
# hosts (e.g. garage-apps). blade02 (bootstrap group) was configured by hand
# before this role had any install/systemd automation, and must not be
# touched: it holds all of this repo's Tofu remote state.

- name: Download Garage binary
  ansible.builtin.get_url:
    url: "https://garagehq.deuxfleurs.fr/_releases/v{{ garage_version }}/{{ garage_arch }}-unknown-linux-musl/garage"
    dest: "{{ garage_install_dir }}/garage"
    mode: "0755"
  when: garage_data_disk is defined
  notify: Restart Garage

- name: Create garage system user
  ansible.builtin.user:
    name: garage
    system: true
    shell: /usr/sbin/nologin
    home: "{{ garage_data_disk_mount }}"
    create_home: false
  when: garage_data_disk is defined

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false
  when: garage_data_disk is defined

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ garage_data_disk }}"
  when: garage_data_disk is defined

- name: Mount Garage data disk
  ansible.posix.mount:
    path: "{{ garage_data_disk_mount }}"
    src: "{{ garage_data_disk }}"
    fstype: ext4
    state: mounted
    opts: defaults,noatime
  when: garage_data_disk is defined

- name: Create Garage data and metadata directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: garage
    group: garage
    mode: "0750"
  loop:
    - "{{ garage_data_dir }}"
    - "{{ garage_meta_dir }}"
  when: garage_data_disk is defined

- name: Write Garage config
  ansible.builtin.template:
    src: garage.toml.j2
    dest: /etc/garage.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Garage

- name: Write Garage default-bucket environment file
  ansible.builtin.template:
    src: garage.env.j2
    dest: /etc/garage.env
    owner: root
    group: root
    mode: "0600"
  when: garage_data_disk is defined
  notify: Restart Garage

- name: Install Garage systemd unit
  ansible.builtin.template:
    src: garage.service.j2
    dest: /etc/systemd/system/garage.service
    owner: root
    group: root
    mode: "0644"
  when: garage_data_disk is defined
  notify:
    - Reload systemd
    - Restart Garage

- name: Enable and start Garage
  ansible.builtin.systemd:
    name: garage
    enabled: true
    state: started
    daemon_reload: true
