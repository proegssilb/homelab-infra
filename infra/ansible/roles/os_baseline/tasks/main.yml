---
# APT proxy (aptcache01). Must come before the first apt task so hosts without
# direct internet access can still refresh and install. apt asks the detect
# script per repository: the proxy if it answers, otherwise a direct
# connection, so a host that still has internet keeps updating through a proxy
# outage. Hosts with apt_proxy_host empty (the proxy itself, the bootstrap node)
# get the config removed.
- name: Check whether the APT proxy is reachable
  ansible.builtin.wait_for:
    host: "{{ apt_proxy_host }}"
    port: "{{ apt_proxy_port }}"
    timeout: 3
  register: os_baseline_apt_proxy_probe
  # Not failed_when: false, which would also mark a timeout as success; the
  # real result is needed below.
  ignore_errors: true
  when: apt_proxy_host | length > 0

# Used by roles that add repos with deb822_repository: its signed_by URL is
# fetched by the module itself, outside apt, so it needs the proxy in the
# environment. Empty when there's no proxy or it didn't answer.
- name: Record proxy environment for repository key downloads
  ansible.builtin.set_fact:
    apt_proxy_env: "{{ {'http_proxy': os_baseline_apt_proxy_url, 'https_proxy': os_baseline_apt_proxy_url}
      if (apt_proxy_host | length > 0 and os_baseline_apt_proxy_probe is succeeded)
      else {} }}"
  vars:
    os_baseline_apt_proxy_url: "http://{{ apt_proxy_host }}:{{ apt_proxy_port }}"

- name: Install APT proxy detect script
  ansible.builtin.copy:
    dest: /usr/local/lib/apt-proxy-detect
    content: |
      #!/bin/bash
      # Managed by Ansible (os_baseline)
      # apt runs this for each repository host: print the proxy if it answers,
      # otherwise DIRECT.
      if timeout 2 bash -c '</dev/tcp/{{ apt_proxy_host }}/{{ apt_proxy_port }}' 2>/dev/null; then
        echo "http://{{ apt_proxy_host }}:{{ apt_proxy_port }}"
      else
        echo DIRECT
      fi
    mode: "0755"
  when: apt_proxy_host | length > 0

- name: Point apt at the proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/01proxy
    content: |
      // Managed by Ansible (os_baseline)
      Acquire::http::Proxy-Auto-Detect "/usr/local/lib/apt-proxy-detect";
      Acquire::https::Proxy-Auto-Detect "/usr/local/lib/apt-proxy-detect";
    mode: "0644"
  when: apt_proxy_host | length > 0

- name: Remove APT proxy config from hosts exempt from the proxy
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/01proxy
    - /usr/local/lib/apt-proxy-detect
  when: apt_proxy_host | length == 0

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install base packages
  ansible.builtin.package:
    name: "{{ base_packages + (extra_packages | default([])) }}"
    state: present

- name: Install qemu-guest-agent
  ansible.builtin.package:
    name: qemu-guest-agent
    state: present
  when: not is_lxc

- name: Enable and start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: not is_lxc

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Configure SSH — disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  notify: Restart sshd

- name: Configure SSH — disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  notify: Restart sshd
  when: not is_lxc

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Persist hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1"
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      # Managed by Ansible (os_baseline)
      [Journal]
      SystemMaxUse={{ journald_system_max_use }}
    mode: "0644"
  notify: Restart journald

# A root disk grown in tofu (disk_size) only reaches the filesystem at the next
# boot via cloud-init; do it online instead. VMs only: the root device is found
# from the live mount, so it doesn't depend on sdX naming.
- name: Install growpart
  ansible.builtin.package:
    name: cloud-guest-utils
    state: present
  when: not is_lxc

- name: Grow root partition and filesystem to fill the disk
  ansible.builtin.shell: |
    set -eu
    src=$(findmnt -no SOURCE /)
    [ "$(findmnt -no FSTYPE /)" = ext4 ] || { echo "SKIP: root is not ext4"; exit 0; }
    part=$(basename "$src")
    disk=$(lsblk -no PKNAME "$src")
    num=$(cat "/sys/class/block/$part/partition")
    if out=$(growpart "/dev/$disk" "$num" 2>&1); then
      resize2fs "$src"
      echo CHANGED
    else
      case "$out" in *NOCHANGE*) echo NOCHANGE ;; *) echo "$out" >&2; exit 1 ;; esac
    fi
  args:
    executable: /bin/bash
  register: os_baseline_growroot
  changed_when: "'CHANGED' in os_baseline_growroot.stdout"
  when: not is_lxc
