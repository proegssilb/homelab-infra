---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install base packages
  ansible.builtin.package:
    name: "{{ base_packages + (extra_packages | default([])) }}"
    state: present

- name: Install qemu-guest-agent
  ansible.builtin.package:
    name: qemu-guest-agent
    state: present
  when: not is_lxc

- name: Enable and start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: not is_lxc

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Configure SSH — disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  notify: Restart sshd

- name: Configure SSH — disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  notify: Restart sshd
  when: not is_lxc

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Persist hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1"
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      # Managed by Ansible (os_baseline)
      [Journal]
      SystemMaxUse={{ journald_system_max_use }}
    mode: "0644"
  notify: Restart journald

# A root disk grown in tofu (disk_size) only reaches the filesystem at the next
# boot via cloud-init; do it online instead. VMs only: the root device is found
# from the live mount, so it doesn't depend on sdX naming.
- name: Install growpart
  ansible.builtin.package:
    name: cloud-guest-utils
    state: present
  when: not is_lxc

- name: Grow root partition and filesystem to fill the disk
  ansible.builtin.shell: |
    set -eu
    src=$(findmnt -no SOURCE /)
    [ "$(findmnt -no FSTYPE /)" = ext4 ] || { echo "SKIP: root is not ext4"; exit 0; }
    part=$(basename "$src")
    disk=$(lsblk -no PKNAME "$src")
    num=$(cat "/sys/class/block/$part/partition")
    if out=$(growpart "/dev/$disk" "$num" 2>&1); then
      resize2fs "$src"
      echo CHANGED
    else
      case "$out" in *NOCHANGE*) echo NOCHANGE ;; *) echo "$out" >&2; exit 1 ;; esac
    fi
  args:
    executable: /bin/bash
  register: os_baseline_growroot
  changed_when: "'CHANGED' in os_baseline_growroot.stdout"
  when: not is_lxc
