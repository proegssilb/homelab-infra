---
- name: Install Docker
  ansible.builtin.import_role:
    name: docker_install

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ forgejo_data_disk }}"

- name: Mount forgejo data disk
  ansible.posix.mount:
    path: "{{ forgejo_data_dir }}"
    src: "{{ forgejo_data_disk }}"
    fstype: ext4
    state: mounted
    opts: defaults,noatime

- name: Create forgejo sub-directories (root-owned)
  ansible.builtin.file:
    path: "{{ forgejo_data_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - postgres

- name: Create forgejo sub-directories (forgejo-owned)
  ansible.builtin.file:
    path: "{{ forgejo_data_dir }}/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - data

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart forgejo

- name: Pull Forgejo images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ forgejo_data_dir }}"

- name: Start Forgejo stack
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_data_dir }}"
    state: present

- name: Wait for Forgejo to be ready
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --user
      - "1000"
      - forgejo-forgejo-1
      - forgejo
      - admin
      - auth
      - list
  register: forgejo_auth_list
  changed_when: false
  retries: 10
  delay: 5
  until: forgejo_auth_list.rc == 0

- name: Add Authentik OAuth2 source to Forgejo
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --user
      - "1000"
      - forgejo-forgejo-1
      - forgejo
      - admin
      - auth
      - add-oauth
      - --name
      - Authentik
      - --provider
      - openidConnect
      - --key
      - "{{ forgejo_oidc_client_id }}"
      - --secret
      - "{{ forgejo_oidc_client_secret | trim }}"
      - --auto-discover-url
      - "{{ forgejo_oidc_discovery_url }}"
      - --scopes
      - "profile email"
  when: "'Authentik' not in forgejo_auth_list.stdout"

- name: Get Authentik auth source ID
  ansible.builtin.set_fact:
    forgejo_authentik_auth_id: "{{ forgejo_auth_list.stdout | regex_search('(\\d+)\\s+Authentik', '\\1') | first }}"
  when: "'Authentik' in forgejo_auth_list.stdout"

- name: Update Authentik OAuth2 source scopes
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --user
      - "1000"
      - forgejo-forgejo-1
      - forgejo
      - admin
      - auth
      - update-oauth
      - --id
      - "{{ forgejo_authentik_auth_id }}"
      - --scopes
      - "profile email"
  when: "'Authentik' in forgejo_auth_list.stdout"
  changed_when: false

# Offline registration: the server learns the runner's shared secret here,
# and the forgejo_runner role writes the same secret into the runner's token
# file, so no one-time token ever has to be copied between hosts. The secret
# goes over stdin so it never shows up in a process listing.
#
# Idempotent (same secret -> same runner), so it runs every play.
# --keep-labels matters: without it `register` resets the runner's labels to
# empty, and a runner with no labels matches no job until it restarts and
# re-declares them. The runner declares its labels itself on connect (it
# also re-reports its version then; `register` blanks that, harmlessly).
- name: Register Forgejo Actions runner
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - --user
      - "1000"
      - forgejo-forgejo-1
      - forgejo
      - forgejo-cli
      - actions
      - register
      - --name
      - "{{ forgejo_runner_name }}"
      # A string flag whose value is ignored: the secret is read from stdin.
      # Bare, it swallows the next argument as its value -- which is how an
      # earlier version of this task lost --keep-labels.
      - --secret-stdin
      - "-"
      - --keep-labels
    stdin: "{{ forgejo_runner_secret | trim }}"
    # forgejo-cli takes stdin verbatim and wants exactly 40 characters.
    stdin_add_newline: false
  no_log: true
  changed_when: false
