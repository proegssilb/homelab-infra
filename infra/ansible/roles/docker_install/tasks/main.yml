---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

# Remove the one-line .list entry written by the old apt_repository task before
# adding the deb822 one: two entries for the same repo with different
# Signed-By values make APT refuse to run.
- name: Remove legacy Docker .list entry
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

# signed_by as a URL: the module fetches the key itself, replacing the separate
# get_url step.
- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    architectures: [amd64]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    signed_by: https://download.docker.com/linux/debian/gpg
  # The key download happens outside apt; send it through the APT proxy too.
  environment: "{{ apt_proxy_env | default({}) }}"
  register: docker_install_source

# The old get_url key path; kept if the module happens to use the same one.
- name: Remove legacy Docker keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent
  when: docker_install_source.key_filename | default('') != '/etc/apt/keyrings/docker.asc'

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# Apps track moving tags (release, latest, :9) or get version bumps, so every
# update leaves the old image behind — untagged or still tagged. Prune weekly
# with --all: any image no container uses goes. Running stacks keep theirs; a
# stack that happens to be stopped re-pulls on next start. Volumes are never
# touched (no --volumes).
- name: Install weekly docker prune service
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-prune.service
    content: |
      # Managed by Ansible (docker_install)
      [Unit]
      Description=Prune unused Docker data (stopped containers, unused images, unused networks, build cache)
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker system prune --all --force
    mode: "0644"
  notify: Reload systemd

- name: Install weekly docker prune timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-prune.timer
    content: |
      # Managed by Ansible (docker_install)
      [Unit]
      Description=Weekly Docker prune

      [Timer]
      OnCalendar=weekly
      RandomizedDelaySec=6h
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd sees the prune units
  ansible.builtin.meta: flush_handlers

- name: Enable weekly docker prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    enabled: true
    state: started
