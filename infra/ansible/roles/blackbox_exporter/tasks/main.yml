---
- name: Create blackbox_exporter system user
  ansible.builtin.user:
    name: blackbox_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download blackbox_exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64.tar.gz"
    mode: "0644"

- name: Extract blackbox_exporter archive
  ansible.builtin.unarchive:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/"

- name: Install blackbox_exporter binary
  ansible.builtin.copy:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/blackbox_exporter"
    dest: "{{ blackbox_exporter_install_dir }}/blackbox_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart blackbox_exporter

- name: Create blackbox_exporter config directory
  ansible.builtin.file:
    path: "{{ blackbox_exporter_config_dir }}"
    state: directory
    owner: root
    group: blackbox_exporter
    mode: "0750"

- name: Template blackbox_exporter config
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_exporter_config_dir }}/blackbox.yml"
    owner: root
    group: blackbox_exporter
    mode: "0640"
  notify: Restart blackbox_exporter

- name: Install blackbox_exporter systemd unit
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart blackbox_exporter

- name: Enable and start blackbox_exporter
  ansible.builtin.systemd:
    name: blackbox_exporter
    enabled: true
    state: started
    daemon_reload: true
