---
homeassistant_version: "2026.9.4"
homeassistant_zigbee2mqtt_version: "2.14.1"
homeassistant_mosquitto_version: "2.1.2-alpine"
# Bump each version together with its checksum: sha256 of the release's zip asset
# (hass-oidc-auth.zip / hacs.zip) from the matching GitHub release.
homeassistant_oidc_auth_version: "1.2.1"
homeassistant_oidc_auth_sha256: "e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd"
homeassistant_hacs_version: "2.0.5"
homeassistant_hacs_sha256: "97be6b824a4f38e683728cc6dd72367f6b8bad0a43428b1b3b987a3087adf413"

homeassistant_data_disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2
homeassistant_data_dir: /opt/homeassistant
homeassistant_trusted_proxies: []

# Local unbound cache in front of the LAN resolver, used by the HA container only
# (the host itself stays on systemd-resolved).
homeassistant_dns_upstream: "{{ ansible_dns.nameservers | first }}"
homeassistant_dns_cache_min_ttl: 30
homeassistant_dns_serve_expired_ttl: 86400

# Recorder (history/statistics) lives on the shared PostgreSQL server, not local SQLite.
homeassistant_db_host: ""
homeassistant_db_name: homeassistant
homeassistant_db_user: homeassistant
homeassistant_db_pass: ""

# SSO via hass-oidc-auth. HA's built-in login stays enabled as break-glass.
homeassistant_oidc_client_id: homeassistant
homeassistant_oidc_client_secret: ""
homeassistant_oidc_discovery_url: ""
homeassistant_oidc_admin_group: homeassistant-admins

# Network-attached Zigbee coordinator, reached over TCP. The adapter must match the
# coordinator's firmware (zstack, ember, ...; see the Zigbee2MQTT adapter docs).
homeassistant_zigbee_coordinator_host: ""
homeassistant_z2m_adapter: zstack
homeassistant_z2m_port: 6638
# Changing the channel after devices are paired forces every device to re-pair.
homeassistant_z2m_channel: 15
homeassistant_z2m_frontend_port: 8080
# Hex strings (32 / 4 / 16 chars); the template converts them to Z2M's numeric forms.
homeassistant_z2m_network_key: ""
homeassistant_z2m_pan_id: ""
homeassistant_z2m_ext_pan_id: ""
homeassistant_z2m_frontend_auth_token: ""
