---
- name: Install Docker
  ansible.builtin.import_role:
    name: docker_install

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ mealie_data_disk }}"

- name: Mount Mealie data disk
  ansible.posix.mount:
    path: "{{ mealie_data_dir }}"
    src: "{{ mealie_data_disk }}"
    fstype: ext4
    state: mounted
    opts: defaults,noatime

- name: Create data subdirectory
  ansible.builtin.file:
    path: "{{ mealie_data_dir }}/data"
    state: directory
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mealie_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart mealie

- name: Pull Mealie image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ mealie_data_dir }}"

- name: Start Mealie stack
  community.docker.docker_compose_v2:
    project_src: "{{ mealie_data_dir }}"
    state: present
