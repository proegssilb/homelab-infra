---
# Network interface the VRRP instance and VIP ride on.
keepalived_interface: "{{ ansible_default_ipv4.interface }}"

# Virtual IP address in CIDR notation (e.g. 192.168.42.69/24).
# Set in group_vars — must be the same on both nodes.
keepalived_vip: ""

# VRRP virtual router ID — must be unique per VRRP instance on the subnet.
keepalived_router_id: 51

# VRRP state for this node: MASTER or BACKUP.
# Override per host in host_vars.
keepalived_state: BACKUP

# VRRP election priority — higher wins. MASTER typically 100, BACKUP 90.
# Override per host in host_vars.
keepalived_priority: 90

# VRRP authentication password (up to 8 chars).
# Vault-encrypt in group_vars so both nodes share the same value.
keepalived_auth_pass: ""

# nginx health-check parameters for the vrrp_script block.
# weight is negative: when nginx is down, effective priority = base_priority + weight.
# With MASTER=100 and BACKUP=90 and weight=-20:
#   healthy MASTER: 100, failed MASTER: 80 → BACKUP (90) wins → failover.
#   healthy BACKUP: 90,  failed BACKUP:  70 → healthy MASTER (80+) still wins.
keepalived_nginx_check_interval: 2
keepalived_nginx_check_fall: 2
keepalived_nginx_check_rise: 2
keepalived_nginx_check_weight: -20

# Aggressive GARP settings — keeps Unifi's ARP table fresh (matches MetalLB L2 behavior).
keepalived_garp_master_delay: 1           # seconds before first GARP burst after winning election (default: 5)
keepalived_garp_master_repeat: 5          # GARPs to send in the initial burst on state transition
keepalived_garp_master_refresh: 10        # seconds between periodic GARP refreshes while MASTER (default: 0 = off)
keepalived_garp_master_refresh_repeat: 2  # GARPs per periodic refresh
keepalived_garp_lower_prio_repeat: 5      # GARPs to send when MASTER sees a lower-priority MASTER (split-brain re-assert)
