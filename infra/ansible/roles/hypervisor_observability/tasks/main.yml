---
# ── Logs ──────────────────────────────────────────────────────────────────────
- name: Install rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present

- name: Forward logs to Loki (via Alloy on obs02)
  ansible.builtin.template:
    src: forward.conf.j2
    dest: /etc/rsyslog.d/90-forward-obs.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

# Checks the whole config (Debian's rsyslog.conf + this drop-in; the drop-in
# alone isn't a valid config). On failure the play stops before the restart
# handler runs, so the running rsyslog keeps its old config.
- name: Check the rsyslog config
  ansible.builtin.command: rsyslogd -N1
  changed_when: false

- name: Enable and start rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started

# ── Ceph ──────────────────────────────────────────────────────────────────────
# A cluster-wide Ceph setting, so once, from one node with the admin keyring.
- name: Ceph Prometheus exporter
  when: inventory_hostname == hypervisor_ceph_admin_host
  block:
    - name: Read enabled Ceph mgr modules
      ansible.builtin.command: ceph mgr module ls --format json
      register: ceph_mgr_modules
      changed_when: false

    - name: Enable the Ceph mgr Prometheus module
      ansible.builtin.command: ceph mgr module enable prometheus
      when: "'prometheus' not in (ceph_mgr_modules.stdout | from_json).enabled_modules"
      changed_when: true
