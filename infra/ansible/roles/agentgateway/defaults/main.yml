---
# agentgateway (standalone) as the lab's MCP gateway: Authentik login for MCP
# clients, CEL rules for which tools each caller may use.
agentgateway_image: "cr.agentgateway.dev/agentgateway:v1.7.0"

agentgateway_dir: /opt/agentgateway
# The image runs as this uid; it owns the SQLite data directory.
agentgateway_uid: 1000

agentgateway_mcp_port: 3000
agentgateway_ui_port: 4001

# Public names, served by proxy01 (group_vars/proxy/vhosts_apps.yml).
agentgateway_mcp_host: "mcp.{{ homelab_domain }}"
agentgateway_admin_host: "mcp-admin.{{ homelab_domain }}"
agentgateway_authentik_url: "https://auth.{{ homelab_domain }}"

# Authentik clients (tofu/pets/authentik_apps.tf).
agentgateway_mcp_client_id: "agentgateway"
agentgateway_ui_client_id: "agentgateway-ui"
agentgateway_ui_client_secret: ""

# Authentik group allowed into the UI, and allowed every MCP tool.
agentgateway_admin_group: "homelab-admins"

# Upstream MCP servers, file-defined (the IaC half; the UI can add more on
# top). Each entry: {name, url}. Names: lowercase, digits, '-' and '.' only.
agentgateway_mcp_targets: []

# Extra mcpAuthorization rules (CEL), OR-ed with the admin-group rule. Put
# per-server rules here as servers are added, e.g.
#   - 'mcp.tool.target == "anamnesis" && "anamnesis-admins" in jwt.groups'
agentgateway_mcp_rules: []

# ── Local models for Coder workspaces (the `llm` section of the config) ──
# Callers present their workspace's Coder agent token; coder-authz checks it
# with Coder. Upstreams: Ollama and PolyStrata on the hand-managed ollama VM.
agentgateway_authz_image: "python:3.13-alpine"
agentgateway_coder_url: "https://dev.{{ homelab_domain }}"
agentgateway_ollama_url: "http://ollama.{{ homelab_domain }}:11434/v1"
agentgateway_polystrata_url: "http://ollama.{{ homelab_domain }}:18081/v1"
agentgateway_polystrata_api_key: ""   # vaulted in group_vars/agentgateway_app.yml
# name: what clients ask for; model: what the upstream calls it. Optional
# defaults / overrides: request-body fields the gateway sets when the client
# didn't / always (agentgateway's llm.models[].defaults and .overrides).
agentgateway_llm_models:
  - { name: "qwen3.8-flash-next", model: "qwen3.8-flash-next-iq3_s", upstream: polystrata }
  # Same pinned model with thinking off, for editors' utility calls (titles,
  # commit messages, intent detection). PolyStrata runs it in its own slot
  # ("parallel": 2 in its config), so these don't queue behind the planner
  # or evict its cached conversation.
  - name: "qwen3.8-flash-next-fast"
    model: "qwen3.8-flash-next-iq3_s"
    upstream: polystrata
    overrides: { reasoning_effort: none }
  - { name: "qwen3.8:27b", model: "qwen3.8:27b", upstream: ollama }
  - { name: "qwen3.6:35b", model: "qwen3.6:35b", upstream: ollama }
  # Embeddings (/llm/v1/embeddings). The Ollama model is a CPU-only copy of
  # qwen3-embedding:0.6b (Modelfile: num_gpu 0, num_ctx 8192), so it never
  # takes VRAM from, or swaps out, the chat models.
  - { name: "qwen3-embedding", model: "qwen3-embedding-cpu", upstream: ollama }
