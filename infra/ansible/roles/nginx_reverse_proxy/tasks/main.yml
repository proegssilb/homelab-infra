---
# An empty or mistyped entry would either break nginx (`deny ;`) or quietly
# drop a restriction, so refuse to run with one.
- name: Check vhost access lists are IPs/CIDRs
  ansible.builtin.assert:
    that:
      - _access_sources | reject('match', '^[0-9a-fA-F:.]+(/[0-9]{1,3})?$') | list | length == 0
    fail_msg: >-
      Not an IP/CIDR in nginx_vhost_default_deny or a vhost's access_allow/access_deny:
      {{ _access_sources | reject('match', '^[0-9a-fA-F:.]+(/[0-9]{1,3})?$') | list }}
    quiet: true
  vars:
    _access_sources: >-
      {{ (nginx_vhost_default_deny
          + (nginx_vhosts | map(attribute='access_allow', default=[]) | flatten)
          + (nginx_vhosts | map(attribute='access_deny', default=[]) | flatten))
         | map('string') | list }}

- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Install nginx stream module
  ansible.builtin.package:
    name: libnginx-mod-stream
    state: present
  when: nginx_stream_proxies | length > 0
  notify: Restart nginx

- name: Template nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Template vhost configs
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/nginx/conf.d/{{ item.name }}.conf
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_vhosts }}"
  notify: Reload nginx

- name: Note that the deploy-key proxy waits for its allow list
  ansible.builtin.debug:
    msg: >-
      nginx_forgejo_keys.allow is empty (no Coder server yet?); leaving the
      Forgejo deploy-key proxy off. Re-run this role once it exists.
  when:
    - nginx_forgejo_keys_forgejo_token | length > 0
    - nginx_forgejo_keys.allow | default([]) | length == 0

- name: Forgejo deploy-key proxy
  when:
    - nginx_forgejo_keys_forgejo_token | length > 0
    - nginx_forgejo_keys.allow | default([]) | length > 0
  block:
    - name: Check deploy-key proxy settings
      ansible.builtin.assert:
        that:
          - nginx_forgejo_keys_forgejo_token | trim | length > 0
          - nginx_forgejo_keys_client_token | trim | length >= 32
          - nginx_forgejo_keys_client_token | trim is match('^[A-Za-z0-9]+$')
          - nginx_forgejo_keys.port | default(0) | int > 0
          - nginx_forgejo_keys.allow | default([]) | length > 0
          - nginx_forgejo_keys.allow | map('string') | reject('match', '^[0-9a-fA-F:.]+(/[0-9]{1,3})?$') | list | length == 0
        fail_msg: >-
          nginx_forgejo_keys needs both tokens (client token: 32+ alphanumerics),
          a port and an allow list of IPs/CIDRs.
        quiet: true

    - name: Template Forgejo deploy-key proxy
      ansible.builtin.template:
        src: forgejo_keys.conf.j2
        dest: /etc/nginx/conf.d/forgejo-keys.conf
        owner: root
        group: root
        mode: "0600" # holds the Forgejo token
      notify: Reload nginx

- name: Remove Forgejo deploy-key proxy when off
  ansible.builtin.file:
    path: /etc/nginx/conf.d/forgejo-keys.conf
    state: absent
  when: >-
    nginx_forgejo_keys_forgejo_token | length == 0
    or nginx_forgejo_keys.allow | default([]) | length == 0
  notify: Reload nginx

- name: Create nginx systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install nginx systemd override (restart on failure)
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Restart=on-failure
      RestartSec=30s
  notify:
    - Reload systemd
    - Restart nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
