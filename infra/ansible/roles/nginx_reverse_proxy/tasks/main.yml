---
# An empty or mistyped entry would either break nginx (`deny ;`) or quietly
# drop a restriction, so refuse to run with one.
- name: Check vhost access lists are IPs/CIDRs
  ansible.builtin.assert:
    that:
      - _access_sources | reject('match', '^[0-9a-fA-F:.]+(/[0-9]{1,3})?$') | list | length == 0
    fail_msg: >-
      Not an IP/CIDR in nginx_vhost_default_deny or a vhost's access_allow/access_deny:
      {{ _access_sources | reject('match', '^[0-9a-fA-F:.]+(/[0-9]{1,3})?$') | list }}
    quiet: true
  vars:
    _access_sources: >-
      {{ (nginx_vhost_default_deny
          + (nginx_vhosts | map(attribute='access_allow', default=[]) | flatten)
          + (nginx_vhosts | map(attribute='access_deny', default=[]) | flatten))
         | map('string') | list }}

- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Install nginx stream module
  ansible.builtin.package:
    name: libnginx-mod-stream
    state: present
  when: nginx_stream_proxies | length > 0
  notify: Restart nginx

- name: Template nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Template vhost configs
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/nginx/conf.d/{{ item.name }}.conf
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_vhosts }}"
  notify: Reload nginx

- name: Create nginx systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install nginx systemd override (restart on failure)
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Restart=on-failure
      RestartSec=30s
  notify:
    - Reload systemd
    - Restart nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
