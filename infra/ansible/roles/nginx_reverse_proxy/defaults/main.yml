---
# List of virtual host definitions to render into /etc/nginx/conf.d/.
# Each entry supports:
#
#   name               — filename stem (conf.d/<name>.conf) and upstream name
#   server_name        — nginx server_name directive value
#   ssl_cert           — path to TLS certificate (fullchain)
#   ssl_key            — path to TLS private key
#   upstream_protocol  — 'https' or 'http' (use 'https' for Proxmox :8006)
#   upstream_servers   — list of backend host:port strings
#   sticky_cookie      — cookie name to hash for sticky routing
#                        (use 'PVEAuthCookie' for Proxmox)
#   extra_proxy_params — (optional) raw nginx directives injected inside
#                        the main location {} block
#   extra_location_blocks — (optional) raw nginx location blocks appended
#                           after the main location block
#
# Override this variable in group_vars or host_vars to customise per role/task.
nginx_vhosts: []

# List of TCP stream proxy definitions (nginx stream module).
# Each entry supports:
#
#   name          — upstream block name
#   listen_port   — TCP port nginx will listen on
#   upstream      — backend host:port string
#
# Requires libnginx-mod-stream; the role installs it automatically when this
# list is non-empty.
nginx_stream_proxies: []

# DNS resolver for runtime upstream hostname resolution (defers lookup to request
# time so nginx starts cleanly even when backend VMs are not yet provisioned).
# Override in group_vars to a known-stable resolver (e.g. the LAN gateway) rather
# than relying on auto-discovery, which may return a stub that varies by OS/config.
# Multiple space-separated IPs are accepted for redundancy.
nginx_resolver: "{{ ansible_dns.nameservers | first }}"
