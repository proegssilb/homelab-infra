---
- name: Install Docker
  ansible.builtin.import_role:
    name: docker_install

- name: Create app directory
  ansible.builtin.file:
    path: "{{ egress_proxy_data_dir }}"
    state: directory
    mode: "0750"

- name: Create addons directory
  ansible.builtin.file:
    path: "{{ egress_proxy_data_dir }}/addons"
    state: directory
    mode: "0755"

- name: Install mitmproxy addons
  ansible.builtin.copy:
    src: block_private.py
    dest: "{{ egress_proxy_data_dir }}/addons/block_private.py"
    mode: "0644"
  notify: Restart egress proxy

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ egress_proxy_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart egress proxy

- name: Pull mitmproxy image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ egress_proxy_data_dir }}"

- name: Start egress proxy stack
  community.docker.docker_compose_v2:
    project_src: "{{ egress_proxy_data_dir }}"
    state: present
