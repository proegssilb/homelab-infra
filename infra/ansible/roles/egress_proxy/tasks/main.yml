---
- name: Install Docker
  ansible.builtin.import_role:
    name: docker_install

- name: Create app directory
  ansible.builtin.file:
    path: "{{ egress_proxy_data_dir }}"
    state: directory
    mode: "0750"

- name: Create addons directory
  ansible.builtin.file:
    path: "{{ egress_proxy_data_dir }}/addons"
    state: directory
    mode: "0755"

- name: Install mitmproxy addons
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ egress_proxy_data_dir }}/addons/{{ item }}"
    mode: "0644"
  loop:
    - allowlist.py
    - block_private.py
  notify: Restart egress proxy

- name: Check the allowlist mode
  ansible.builtin.assert:
    that: egress_proxy_allowlist_mode in ['shadow', 'enforce']
    fail_msg: egress_proxy_allowlist_mode must be shadow or enforce.

# Read once at startup, so a change restarts the proxy.
- name: Write the destination allowlist
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (egress_proxy_allowlist) — do not edit by hand.
      {% for host in egress_proxy_allowlist %}
      {{ host }}
      {% endfor %}
    dest: "{{ egress_proxy_data_dir }}/addons/allowlist.txt"
    mode: "0644"
  notify: Restart egress proxy

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ egress_proxy_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart egress proxy

- name: Pull mitmproxy image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ egress_proxy_data_dir }}"

- name: Start egress proxy stack
  community.docker.docker_compose_v2:
    project_src: "{{ egress_proxy_data_dir }}"
    state: present
