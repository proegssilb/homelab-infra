---
# Egress proxy for Coder workspaces (AI agents): mitmproxy on egress01, on the
# agentsvc VLAN (tofu/pets/agentsvc.tf).
#
# Phase 1, logging only: every host is passed through untouched (no TLS
# interception, so no CA in workspaces yet and the proxy never sees decrypted
# traffic). It logs one line per HTTPS destination ("server connect host:443")
# and the full request line for plain HTTP, with the client's address, to the
# journal and from there to Loki ({host="egress01"}, SYSLOG_IDENTIFIER
# egress-proxy). Workspaces only go through it once they set HTTP(S)_PROXY.
egress_proxy_version: "12.3.1"
egress_proxy_data_dir: /opt/egress-proxy
egress_proxy_port: 8080
# Regexes for hosts passed through without TLS interception. ".*" = all of
# them (logging phase). Narrow this when interception starts.
egress_proxy_ignore_hosts:
  - ".*"

# Destination allowlist (files/allowlist.py). "shadow" passes everything and
# tags each connection in the log: find the misses in Loki with
#   {host="egress01"} |= "egress would refuse"
# "enforce" refuses hosts not listed. Non-public destinations are refused in
# both modes. Entries: "host" (exactly that host) or "*.domain" (subdomains,
# not the domain itself).
egress_proxy_allowlist_mode: shadow
egress_proxy_allowlist:
  # Coder template bootstrap (code-server install script and release)
  - code-server.dev
  # GitHub: source, tarballs, release binaries. No credentials in workspaces,
  # but it's still an upload channel (public gists, issues) once enforced.
  - github.com
  - api.github.com
  - codeload.github.com
  - raw.githubusercontent.com
  - objects.githubusercontent.com
  - release-assets.githubusercontent.com
  # Agent model API and tooling (Claude Code); adjust to the agents in use
  - api.anthropic.com
  - claude.ai
  - console.anthropic.com
  - statsig.anthropic.com
  # Rust
  - crates.io
  - index.crates.io
  - static.crates.io
  - static.rust-lang.org
  - sh.rustup.rs
  # Python
  - pypi.org
  - files.pythonhosted.org
  # npm
  - registry.npmjs.org
  # Container images
  - registry-1.docker.io
  - auth.docker.io
  - production.cloudflare.docker.com
  - ghcr.io
  - pkg-containers.githubusercontent.com
  # Reference
  - wikipedia.org
  - "*.wikipedia.org"
  - upload.wikimedia.org
  - stackoverflow.com
  - "*.stackoverflow.com"
  - cdn.sstatic.net
