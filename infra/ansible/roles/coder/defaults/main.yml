---
coder_version: "v2.38.6"
coder_postgres_version: "17"
coder_data_dir: /opt/coder
coder_port: 7080
# External URL workspaces and browsers use to reach Coder (set in group_vars).
coder_access_url: ""
# Generate: openssl rand -hex 32 | ansible-vault encrypt_string --stdin-name coder_db_password
coder_db_password: ""

# ── Proxmox workspaces (template: files/coder-templates/proxmox-vm) ────────────
# coder@pve is created by tofu/pets/coder_proxmox.tf, fenced to the "coder" pool.
coder_proxmox_endpoint: ""
coder_proxmox_user: coder@pve
coder_proxmox_password: ""
# Key Coder uses to SSH into workspace VMs to install the agent.
coder_workspace_ssh_public_key: ""
coder_workspace_ssh_private_key: ""
coder_proxmox_template:
  # coder-template (tofu/pets/coder_proxmox.tf): a copy of the lab template
  # with its NIC on the agents VNet, so cloning needs no vmbr0 permission.
  # The node must match where tofu puts it (pets' template_node).
  clone_template_vmid: 903
  clone_template_node: pxmx02
  nodes: [pxmx01, pxmx02, pxmx03, pxmx04, pxmx05]
  datastore: ceph-ssd-pool
  # SDN VNet for the Agents VLAN (30), created in tofu/pets/coder_proxmox.tf;
  # it tags the traffic itself, so vlan_id stays 0. Workspaces (where AI
  # agents run) reach only the proxy, git and the apt cache; the UniFi Agents
  # zone blocks everything else. coder@pve may use only this VNet.
  bridge: agents
  vlan_id: 0
  pool: coder
  vmid_min: 1000
  # Workspace IPs are static, derived from the VMID (see coder_agents_cidr);
  # 1000-1239 fills .10-.249 of a /24. 1240-1999 stay reserved for Coder.
  vmid_max: 1239
# Addresses each workspace VM's Proxmox firewall accepts SSH from (all other
# inbound is dropped, including from other workspaces). The Coder server must
# be here: it installs the agent over SSH. Add admin hosts (e.g. in local.yml)
# only if they should SSH in directly rather than through Coder.
coder_workspace_ssh_sources:
  - "{{ ansible_default_ipv4.address }}"
# Subnet of the workspace network (UniFi "Agents", VLAN 30), e.g. 10.0.30.0/24.
# Site-specific: set it in group_vars/all/local.yml. That network runs no DHCP;
# each workspace gets a static IP derived from its VMID, and its VM firewall
# only lets it send from that address.
coder_agents_cidr: ""
# Per-workspace Forgejo deploy keys (template proxmox-vm). Coder talks to the
# deploy-key proxy on proxy01 (nginx_forgejo_keys), never to Forgejo with a
# real token; the template refuses to push without these.
# URL of that proxy, e.g. https://code.example.com:9443
coder_forgejo_keys_url: ""
# Token Coder presents to that proxy; must equal nginx_forgejo_keys_client_token
# (both are set from forgejo_keys_client_token in group_vars/all/main.yml).
coder_forgejo_keys_token: ""
# Repo URL prefixes (up to owner/repo) that count as this Forgejo.
coder_forgejo_ssh_url_prefix: ""
coder_forgejo_web_url_prefix: ""
# Workspace egress (template proxmox-vm): sessions' HTTP(S) via the egress
# proxy (mitmproxy on egress01), lab names direct (NO_PROXY), apt via the lab
# apt cache, time from egress01's chrony.
coder_egress_proxy_url: ""
coder_no_proxy: []
coder_apt_proxy_url: ""
coder_ntp_server: ""
# Coder API token of an Owner, used to push templates. Leave empty to skip the
# push (e.g. right after a rebuild, before the first admin exists).
# Create: Coder UI -> Account -> Tokens, then ansible-vault encrypt_string --stdin-name coder_admin_token
coder_admin_token: ""
