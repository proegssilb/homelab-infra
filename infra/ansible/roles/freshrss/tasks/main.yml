---
- name: Install Docker
  ansible.builtin.import_role:
    name: docker_install

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ freshrss_data_disk }}"

- name: Mount FreshRSS data disk
  ansible.posix.mount:
    path: "{{ freshrss_data_dir }}"
    src: "{{ freshrss_data_disk }}"
    fstype: ext4
    state: mounted
    opts: defaults,noatime

- name: Create data subdirectories
  ansible.builtin.file:
    path: "{{ freshrss_data_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - data
    - extensions

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ freshrss_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart freshrss

- name: Pull FreshRSS image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ freshrss_data_dir }}"

- name: Start FreshRSS stack
  community.docker.docker_compose_v2:
    project_src: "{{ freshrss_data_dir }}"
    state: present
