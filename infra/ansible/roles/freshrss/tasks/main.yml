---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ freshrss_data_disk }}"

- name: Mount FreshRSS data disk
  ansible.posix.mount:
    path: "{{ freshrss_data_dir }}"
    src: "{{ freshrss_data_disk }}"
    fstype: ext4
    state: mounted
    opts: defaults,noatime

- name: Create data subdirectories
  ansible.builtin.file:
    path: "{{ freshrss_data_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - data
    - extensions

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ freshrss_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart freshrss

- name: Pull FreshRSS image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ freshrss_data_dir }}"

- name: Start FreshRSS stack
  community.docker.docker_compose_v2:
    project_src: "{{ freshrss_data_dir }}"
    state: present
