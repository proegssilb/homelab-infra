---
- name: Reload udev rules for the UPS
  ansible.builtin.command: udevadm trigger --subsystem-match=usb --action=add
  changed_when: true

- name: Restart NUT driver
  ansible.builtin.systemd:
    name: nut-driver-enumerator.service
    state: restarted

- name: Restart NUT server
  ansible.builtin.systemd:
    name: nut-server.service
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart nut_exporter
  ansible.builtin.systemd:
    name: nut_exporter
    state: restarted
