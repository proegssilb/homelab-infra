# Managed by Ansible (snmp_exporter role) — do not edit by hand.
#
# ups_mib_get: the stock ups_mib module (standard UPS-MIB, RFC 1628), but read
# with plain GETs. snmp_exporter walks with GETBULK on SNMPv2c/v3, and some
# older UPS cards never answer GETBULK over v3 (not even max-repetitions 1)
# while answering GETs. Single-phase only: table values are row 1. The
# metric definitions are copied from the stock module, so the same alert
# rules apply. Every OID must exist on the card: such cards fail a whole GET
# with noSuchName when one OID is missing (upsInputLineBads isn't here for
# that reason).
modules:
  ups_mib_get:
    get:
      - 1.3.6.1.2.1.33.1.2.1.0
      - 1.3.6.1.2.1.33.1.2.2.0
      - 1.3.6.1.2.1.33.1.2.3.0
      - 1.3.6.1.2.1.33.1.2.4.0
      - 1.3.6.1.2.1.33.1.2.5.0
      - 1.3.6.1.2.1.33.1.2.7.0
      - 1.3.6.1.2.1.33.1.3.3.1.2.1
      - 1.3.6.1.2.1.33.1.3.3.1.3.1
      - 1.3.6.1.2.1.33.1.4.1.0
      - 1.3.6.1.2.1.33.1.4.2.0
      - 1.3.6.1.2.1.33.1.4.4.1.2.1
      - 1.3.6.1.2.1.33.1.4.4.1.5.1
      - 1.3.6.1.2.1.33.1.6.1.0
      - 1.3.6.1.2.1.33.1.7.3.0
    metrics:
      - name: upsBatteryStatus
        oid: 1.3.6.1.2.1.33.1.2.1
        type: gauge
        help: The indication of the capacity remaining in the UPS system's batteries - 1.3.6.1.2.1.33.1.2.1
        enum_values:
          1: unknown
          2: batteryNormal
          3: batteryLow
          4: batteryDepleted
      - name: upsSecondsOnBattery
        oid: 1.3.6.1.2.1.33.1.2.2
        type: gauge
        help: If the unit is on battery power, the elapsed time since the UPS last switched to battery
          power, or the time since the network management subsystem was last restarted, whichever is less
          - 1.3.6.1.2.1.33.1.2.2
      - name: upsEstimatedMinutesRemaining
        oid: 1.3.6.1.2.1.33.1.2.3
        type: gauge
        help: An estimate of the time to battery charge depletion under the present load conditions if
          the utility power is off and remains off, or if it were to be lost and remain off. - 1.3.6.1.2.1.33.1.2.3
      - name: upsEstimatedChargeRemaining
        oid: 1.3.6.1.2.1.33.1.2.4
        type: gauge
        help: An estimate of the battery charge remaining expressed as a percent of full charge. - 1.3.6.1.2.1.33.1.2.4
      - name: upsBatteryVoltage
        oid: 1.3.6.1.2.1.33.1.2.5
        type: gauge
        help: The magnitude of the present battery voltage. - 1.3.6.1.2.1.33.1.2.5
        scale: 0.1
      - name: upsBatteryTemperature
        oid: 1.3.6.1.2.1.33.1.2.7
        type: gauge
        help: The ambient temperature at or near the UPS Battery casing. - 1.3.6.1.2.1.33.1.2.7
      - name: upsInputFrequency
        oid: 1.3.6.1.2.1.33.1.3.3.1.2
        type: gauge
        help: The present input frequency. - 1.3.6.1.2.1.33.1.3.3.1.2
        indexes:
          - labelname: upsInputLineIndex
            type: gauge
        scale: 0.1
      - name: upsInputVoltage
        oid: 1.3.6.1.2.1.33.1.3.3.1.3
        type: gauge
        help: The magnitude of the present input voltage. - 1.3.6.1.2.1.33.1.3.3.1.3
        indexes:
          - labelname: upsInputLineIndex
            type: gauge
      - name: upsOutputSource
        oid: 1.3.6.1.2.1.33.1.4.1
        type: gauge
        help: The present source of output power - 1.3.6.1.2.1.33.1.4.1
        enum_values:
          1: other
          2: none
          3: normal
          4: bypass
          5: battery
          6: booster
          7: reducer
      - name: upsOutputFrequency
        oid: 1.3.6.1.2.1.33.1.4.2
        type: gauge
        help: The present output frequency. - 1.3.6.1.2.1.33.1.4.2
        scale: 0.1
      - name: upsOutputVoltage
        oid: 1.3.6.1.2.1.33.1.4.4.1.2
        type: gauge
        help: The present output voltage. - 1.3.6.1.2.1.33.1.4.4.1.2
        indexes:
          - labelname: upsOutputLineIndex
            type: gauge
      - name: upsOutputPercentLoad
        oid: 1.3.6.1.2.1.33.1.4.4.1.5
        type: gauge
        help: The percentage of the UPS power capacity presently being used on this output line, i.e.,
          the greater of the percent load of true power capacity and the percent load of VA. - 1.3.6.1.2.1.33.1.4.4.1.5
        indexes:
          - labelname: upsOutputLineIndex
            type: gauge
      - name: upsAlarmsPresent
        oid: 1.3.6.1.2.1.33.1.6.1
        type: gauge
        help: The present number of active alarm conditions. - 1.3.6.1.2.1.33.1.6.1
      - name: upsTestResultsSummary
        oid: 1.3.6.1.2.1.33.1.7.3
        type: gauge
        help: The results of the current or last UPS diagnostics test performed - 1.3.6.1.2.1.33.1.7.3
        enum_values:
          1: donePass
          2: doneWarning
          3: doneError
          4: aborted
          5: inProgress
          6: noTestsInitiated
