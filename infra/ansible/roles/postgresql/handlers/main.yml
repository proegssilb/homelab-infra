---
- name: Restart postgresql
  ansible.builtin.systemd:
    name: "postgresql@{{ postgresql_version }}-main"
    state: restarted

- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
