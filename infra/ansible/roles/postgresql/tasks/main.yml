---
- name: Write PostgreSQL kernel tuning parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-postgresql.conf
    content: |
      vm.swappiness = 1
      vm.overcommit_memory = 2
      vm.overcommit_ratio = 80
      vm.dirty_background_ratio = 5
      vm.dirty_ratio = 10
      kernel.sched_migration_cost_ns = 5000000
    mode: "0644"
  notify: Apply sysctl

- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - postgresql-{{ postgresql_version }}
      - postgresql-{{ postgresql_version }}-pgvector
      - python3-psycopg2
      - rsync
      - nfs-common
    state: present
    update_cache: true

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false

- name: Check if data disk is already mounted at data directory
  ansible.builtin.command:
    cmd: findmnt -n -o TARGET --source {{ postgresql_data_disk }}
  register: _pg_disk_mount
  changed_when: false
  failed_when: false

- name: Check if data disk already has a filesystem
  ansible.builtin.command:
    cmd: blkid -c /dev/null -o value -s TYPE {{ postgresql_data_disk }}
  register: _pg_disk_fstype
  changed_when: false
  failed_when: false
  when: _pg_disk_mount.stdout | trim != postgresql_data_dir

- name: Wipe stale metadata from data disk
  ansible.builtin.command:
    cmd: wipefs -a {{ postgresql_data_disk }}
  when:
    - _pg_disk_mount.stdout | trim != postgresql_data_dir
    - _pg_disk_fstype.stdout | default('') | trim == ""

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ postgresql_data_disk }}"

- name: Mount data disk and migrate PostgreSQL data directory
  when: _pg_disk_mount.stdout | trim != postgresql_data_dir
  block:
    - name: Stop PostgreSQL before moving data directory
      ansible.builtin.systemd:
        name: "postgresql@{{ postgresql_version }}-main"
        state: stopped

    - name: Move existing data directory to temp location
      ansible.builtin.command:
        cmd: mv {{ postgresql_data_dir }} {{ postgresql_data_dir }}.orig
        creates: "{{ postgresql_data_dir }}.orig"

    - name: Create data directory mount point
      ansible.builtin.file:
        path: "{{ postgresql_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Mount data disk at PostgreSQL data directory
      ansible.posix.mount:
        path: "{{ postgresql_data_dir }}"
        src: "{{ postgresql_data_disk }}"
        fstype: ext4
        state: mounted
        opts: defaults,noatime

- name: Check if original data directory backup exists
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}.orig"
  register: _pg_data_orig

- name: Restore data directory contents from temp location
  ansible.builtin.command:
    cmd: rsync -a {{ postgresql_data_dir }}.orig/ {{ postgresql_data_dir }}/
    creates: "{{ postgresql_data_dir }}/{{ postgresql_version }}"
  when: _pg_data_orig.stat.exists

- name: Fix ownership of restored data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    owner: postgres
    group: postgres
    recurse: true
  when: _pg_data_orig.stat.exists

- name: Template PostgreSQL tuning configuration
  ansible.builtin.template:
    src: ansible.conf.j2
    dest: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/ansible.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgresql

- name: Template pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgresql

- name: Enable and start PostgreSQL
  ansible.builtin.systemd:
    name: "postgresql@{{ postgresql_version }}-main"
    enabled: true
    state: started

- name: Create database users
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    state: present
  become_user: postgres
  loop: "{{ postgresql_users }}"

- name: Create databases
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    state: present
  become_user: postgres
  loop: "{{ postgresql_databases }}"

- name: Enable PostgreSQL extensions
  community.postgresql.postgresql_ext:
    name: "{{ item.name }}"
    db: "{{ item.db }}"
    state: present
  become_user: postgres
  loop: "{{ postgresql_extensions }}"

- name: Create backup mount point
  ansible.builtin.file:
    path: "{{ postgresql_backup_mount }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: >
    postgresql_backup_nfs_server != "" and
    postgresql_backup_mount not in (ansible_mounts | map(attribute='mount') | list)

- name: Mount NFS backup share from TrueNAS
  ansible.posix.mount:
    path: "{{ postgresql_backup_mount }}"
    src: "{{ postgresql_backup_nfs_server }}:{{ postgresql_backup_nfs_path }}"
    fstype: nfs
    state: mounted
    opts: "{{ postgresql_backup_nfs_opts }}"
  when: postgresql_backup_nfs_server != ""

- name: Install backup script
  ansible.builtin.template:
    src: pg-backup.sh.j2
    dest: /usr/local/bin/pg-backup.sh
    owner: postgres
    group: postgres
    mode: "0750"

- name: Install pg-backup systemd service
  ansible.builtin.template:
    src: pg-backup.service.j2
    dest: /etc/systemd/system/pg-backup.service
    mode: "0644"
  notify: Reload systemd

- name: Install pg-backup systemd timer
  ansible.builtin.template:
    src: pg-backup.timer.j2
    dest: /etc/systemd/system/pg-backup.timer
    mode: "0644"
  notify: Reload systemd

- name: Enable and start pg-backup timer
  ansible.builtin.systemd:
    name: pg-backup.timer
    enabled: true
    state: started
    daemon_reload: true
