---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ immich_data_disk }}"

- name: Mount Immich data disk (thumbnails, encoded video, model cache)
  ansible.posix.mount:
    path: "{{ immich_data_dir }}"
    src: "{{ immich_data_disk }}"
    fstype: ext4
    state: mounted
    opts: defaults,noatime

- name: Create Immich subdirectories on data disk
  ansible.builtin.file:
    path: "{{ immich_data_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - thumbs
    - encoded-video
    - profile
    - backups
    - model-cache

- name: Mount NFS photo library from TrueNAS
  ansible.posix.mount:
    path: "{{ immich_data_dir }}/library"
    src: "{{ immich_library_nfs_server }}:{{ immich_library_nfs_path }}"
    fstype: nfs
    state: mounted
    opts: vers=4,nofail,noatime
  when: immich_library_nfs_enabled

- name: Create local library directory (NFS disabled fallback)
  ansible.builtin.file:
    path: "{{ immich_data_dir }}/library"
    state: directory
    mode: "0750"
  when: not immich_library_nfs_enabled

- name: Template .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_data_dir }}/.env"
    mode: "0640"
  notify: Restart immich

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart immich

- name: Pull Immich images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ immich_data_dir }}"

- name: Start Immich stack
  community.docker.docker_compose_v2:
    project_src: "{{ immich_data_dir }}"
    state: present
