---
- name: Install Docker
  ansible.builtin.import_role:
    name: docker_install

- name: Settle udev events before touching data disk
  ansible.builtin.command:
    cmd: udevadm settle
  changed_when: false

- name: Create ext4 filesystem on data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ authentik_data_disk }}"

- name: Mount authentik data disk
  ansible.posix.mount:
    path: "{{ authentik_data_dir }}"
    src: "{{ authentik_data_disk }}"
    fstype: ext4
    state: mounted
    opts: defaults,noatime

- name: Create authentik sub-directories (root-owned)
  ansible.builtin.file:
    path: "{{ authentik_data_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - postgres

- name: Create authentik sub-directories (authentik-owned)
  ansible.builtin.file:
    path: "{{ authentik_data_dir }}/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - data
    - data/media
    - custom-templates
    - certs

- name: Check for legacy media directory (pre-2025.12 layout)
  ansible.builtin.stat:
    path: "{{ authentik_data_dir }}/media"
  register: legacy_media

- name: Migrate media to data/media (2025.12 path change)
  ansible.builtin.command:
    cmd: mv {{ authentik_data_dir }}/media {{ authentik_data_dir }}/data/media
  when: legacy_media.stat.exists and legacy_media.stat.isdir
  changed_when: true

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_data_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart authentik

- name: Pull Authentik images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ authentik_data_dir }}"

- name: Start Authentik stack
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_data_dir }}"
    state: present

- name: Wait for Authentik server to be ready
  ansible.builtin.uri:
    url: "http://localhost:9000/-/health/ready/"
    status_code: [200, 204]
  register: _authentik_health
  until: _authentik_health.status in [200, 204]
  retries: 30
  delay: 10

- name: Assert AUTHENTIK_TOKEN is set
  ansible.builtin.assert:
    that: lookup('env', 'AUTHENTIK_TOKEN') | length > 0
    fail_msg: "AUTHENTIK_TOKEN is not set — source .env before running Ansible."

- name: Ensure bootstrap API token exists in Authentik
  ansible.builtin.shell:
    cmd: |
      docker compose exec -T -e AUTHENTIK_TOKEN server ak shell -c "
      from authentik.core.models import Token, TokenIntents, User
      import os
      u = User.objects.get(username='akadmin')
      Token.objects.get_or_create(
          identifier='tofu-bootstrap',
          defaults={
              'user': u,
              'intent': TokenIntents.INTENT_API,
              'expiring': False,
              'key': os.environ['AUTHENTIK_TOKEN'],
          }
      )
      "
    chdir: "{{ authentik_data_dir }}"
  environment:
    AUTHENTIK_TOKEN: "{{ lookup('env', 'AUTHENTIK_TOKEN') }}"
  changed_when: false
