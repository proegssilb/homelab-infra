---
postgresql_databases:
  - { name: mealie,   owner: mealie   }
  - { name: freshrss, owner: freshrss }
  - { name: immich,   owner: immich   }

postgresql_users:
  - { name: mealie,   password: "{{ mealie_db_pass | trim }}",   db: mealie   }
  - { name: freshrss, password: "{{ freshrss_db_pass | trim }}", db: freshrss }
  - { name: immich,   password: "{{ immich_db_pass | trim }}",   db: immich   }

# Immich's InitialMigration runs CREATE EXTENSION for each of these. Its DB user is
# not a superuser, and `earthdistance` and `vector` are not trusted extensions, so the
# migration fails unless they already exist. Create them here as postgres instead —
# Immich's CREATE EXTENSION IF NOT EXISTS then becomes a no-op.
# `cube` must precede `earthdistance`, which depends on it.
postgresql_extensions:
  - { db: immich, name: cube }
  - { db: immich, name: earthdistance }
  - { db: immich, name: pg_trgm }
  - { db: immich, name: unaccent }
  - { db: immich, name: uuid-ossp }
  - { db: immich, name: vector }
