---
# Every Debian host fetches packages through aptcache01 (a bootc VM in tofu/lab,
# apt-cacher-ng; its allowlist is in tofu/lab/aptcache01.tf), so servers that only
# need the internet for packages can be cut off from it. It's static and named in
# the lab zone. Exempt: the bootstrap node (group_vars/bootstrap), which `just
# bootstrap` configures before the proxy exists.
apt_proxy_host: "aptcache01.{{ lab_dns_zone }}"
apt_proxy_port: 3142
