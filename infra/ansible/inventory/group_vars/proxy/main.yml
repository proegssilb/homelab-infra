---
# Vars shared by all hosts in the 'proxy' group.
#
# Site-specific values (homelab_domain, homelab_proxmox_nodes, certbot_email)
# live in local.yml alongside this file — see local.yml.example.

# LXC containers SSH as root (no cloud-init user; key goes into root's authorized_keys).
ansible_user: root

# ── nginx ─────────────────────────────────────────────────────────────────────

# Explicit resolver for upstream hostname resolution at request time.
# Using the LAN DNS directly rather than auto-discovery from resolv.conf,
# because on Debian 13 the stub address is not guaranteed to be 127.0.0.53.
nginx_resolver: "192.168.20.1"

nginx_vhosts:
  - name: proxmox
    server_name: "proxmox.{{ homelab_domain }}"
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key: "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: https
    upstream_servers: "{{ homelab_proxmox_nodes | map('regex_replace', '$', '.' + homelab_domain + ':8006') | list }}"
    sticky_cookie: PVEAuthCookie

  - name: forgejo
    server_name: "code.{{ homelab_domain }}"
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key: "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "forgejo.{{ homelab_domain }}:3000"

# ── certbot ───────────────────────────────────────────────────────────────────

certbot_domains:
  - "*.{{ homelab_domain }}"
  - "{{ homelab_domain }}"

# Cloudflare API token (Zone → DNS → Edit for the appropriate zone).
# Encrypt: ansible-vault encrypt_string '<token>' --name certbot_cloudflare_api_token
certbot_cloudflare_api_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
