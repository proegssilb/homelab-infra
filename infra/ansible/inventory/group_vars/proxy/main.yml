---
# Vars shared by all hosts in the 'proxy' group (proxy01, proxy02).
# Extend with host_vars for per-node overrides (e.g. keepalived state/priority).
#
# Site-specific values (homelab_domain, homelab_proxmox_nodes, certbot_email)
# live in local.yml alongside this file — see local.yml.example.

# ── keepalived ────────────────────────────────────────────────────────────────

# Network interface the VIP and VRRP hellos are sent on.
keepalived_interface: eth0

# VRRP authentication passphrase — same on both nodes.
# Generate: openssl rand -base64 6 | head -c 8
# Encrypt:  ansible-vault encrypt_string '<value>' --name keepalived_auth_pass
keepalived_auth_pass: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          66363330366638653738633336663963306466383265626138363262323635663832366237623434
          3536363239383661323233656434363132376266666431620a636131356537376636373563616430
          36616634643531323964333836323265396633356362616636303833363330306663353431633330
          3631623031316462370a393636653139376164376432636532326530363463306162353937373162
          6135

# ── nginx ─────────────────────────────────────────────────────────────────────

nginx_vhosts:
  - name: proxmox
    server_name: "proxmox.{{ homelab_domain }}"
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key: "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: https
    upstream_servers: "{{ homelab_proxmox_nodes | map('regex_replace', '$', '.' + homelab_domain + ':8006') | list }}"
    sticky_cookie: PVEAuthCookie

# ── certbot ───────────────────────────────────────────────────────────────────

certbot_domains:
  - "*.{{ homelab_domain }}"
  - "{{ homelab_domain }}"

# Cloudflare API token (Zone → DNS → Edit for the appropriate zone).
# Encrypt: ansible-vault encrypt_string '<token>' --name certbot_cloudflare_api_token
certbot_cloudflare_api_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          30303435383835626531303664623738346161373739616563313261323338343632633030316631
          6461306239333838396562333364623937303562326530340a653331343031633336373730373936
