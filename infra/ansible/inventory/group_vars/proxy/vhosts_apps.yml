---
_nginx_vhosts_apps:
  - name: forgejo
    server_name: "code.{{ homelab_domain }}"
    homepage:
      name: Code
      description: Forgejo git forge
      icon: forgejo.png
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "forgejo.{{ homelab_domain }}:3000"

  - name: authentik
    server_name: "auth.{{ homelab_domain }}"
    homepage:
      name: Authentik
      description: Single sign-on
      icon: authentik.png
      group: Lab
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "authentik.{{ homelab_domain }}:9000"

  - name: nextcloud
    server_name: "nc.{{ homelab_domain }}"
    homepage:
      name: Nextcloud
      description: Files & sync
      icon: nextcloud.png
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "nextcloud.{{ homelab_domain }}:80"

  - name: budget
    server_name: "budget.{{ homelab_domain }}"
    homepage:
      name: Budget
      description: Actual Budget
      icon: actual-budget.png
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      # Backend VM is named "actual" (renamed from "budget") so the public
      # alias below doesn't collide with the VM's own DHCP-registered DNS name.
      - "actual.{{ homelab_domain }}:5006"

  - name: mealie
    server_name: "meals.{{ homelab_domain }}"
    homepage:
      name: Meals
      description: Mealie recipes
      icon: mealie.png
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      # Public alias intentionally differs from the VM hostname (mealie) to
      # avoid colliding with the VM's own DHCP-registered DNS name.
      - "mealie.{{ homelab_domain }}:9000"

  - name: freshrss
    server_name: "rss.{{ homelab_domain }}"
    homepage:
      name: RSS
      description: FreshRSS feeds
      icon: freshrss.png
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "freshrss.{{ homelab_domain }}:8080"
    # Answers 401 until logged in; only 5xx/no answer is down.
    probe_module: http_reachable

  - name: immich
    server_name: "photos.{{ homelab_domain }}"
    homepage:
      name: Photos
      description: Immich photo library
      icon: immich.png
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "immich.{{ homelab_domain }}:2283"
    extra_proxy_params: "client_max_body_size 10g;"

  - name: searxng
    server_name: "search.{{ homelab_domain }}"
    homepage:
      name: Search
      description: SearXNG metasearch
      icon: searxng.png
      # SearXNG's limiter answers 429 to non-browser clients on every page but this.
      monitor_path: /healthz
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "searxng.{{ homelab_domain }}:8080"

  - name: ittools
    server_name: "tools.{{ homelab_domain }}"
    homepage:
      name: Tools
      description: IT Tools utilities
      icon: it-tools.png
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "ittools.{{ homelab_domain }}:8080"

  - name: anamnesis
    server_name: "tasks.{{ homelab_domain }}"
    homepage:
      name: Tasks
      description: Anamnesis task tracker
      icon: mdi-checkbox-marked-outline
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "anamnesis.{{ homelab_domain }}:8080"
    # Anamnesis defaults ANAMNESIS_MAX_BODY_BYTES to 40MiB; match it here so
    # nginx doesn't reject large attachments before the app ever sees them.
    extra_proxy_params: "client_max_body_size 40m;"

  - name: homeassistant
    server_name: "ha.{{ homelab_domain }}"
    homepage:
      name: Home Assistant
      description: Home automation
      icon: home-assistant.png
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      # Public alias intentionally differs from the VM hostname (homeassistant)
      # to avoid colliding with the VM's own DHCP-registered DNS name.
      - "homeassistant.{{ homelab_domain }}:8123"

  - name: homepage
    server_name: "home.{{ homelab_domain }}"
    homepage: false   # the page itself
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "homepage.{{ homelab_domain }}:3000"

  - name: garage-apps-s3
    server_name: "s3.{{ homelab_domain }}"
    homepage: false   # not something you'd click
    ssl_cert: "/etc/letsencrypt/live/{{ homelab_domain }}/fullchain.pem"
    ssl_key:  "/etc/letsencrypt/live/{{ homelab_domain }}/privkey.pem"
    upstream_protocol: http
    upstream_servers:
      - "garage-apps.{{ homelab_domain }}:3900"
    # Object PUTs traverse this vhost, so nginx's 1m default would cap every
    # upload well below what the apps behind it allow (anamnesis alone permits
    # 40MiB). Generous but still bounded, since this endpoint is shared.
    extra_proxy_params: "client_max_body_size 5g;"
    # Anonymous requests get 403 from a healthy Garage; only 5xx/no answer is down.
    probe_module: http_reachable
