---
# Static inventory for physical hosts that are not Proxmox VMs/containers.
# The Proxmox dynamic inventory (proxmox.yml) covers everything else.

all:
  children:
    bootstrap:
      hosts:
        blade02:
    # Proxmox nodes. Observability only (hypervisors.yml, `just tune-hypervisors`):
    # Debian's node_exporter, rsyslog forwarding to Loki, Ceph's own exporter.
    # site.yml skips them, and they get no os_baseline. The `ansible` user (key
    # login, passwordless sudo) is created by hand on each node.
    hypervisors:
      hosts:
        pxmx01:
        pxmx02:
        pxmx03:
        pxmx04:
        pxmx05:
        grunt:
