---
# Force-reset all app database user passwords to the current vault values.
#
# Use this when 'just tune pg01' doesn't fix a credential mismatch — e.g. a user
# was created with an empty password before the vault secret was set, or a vault
# secret was rotated without re-running the postgresql role.
#
# Prereq: app users must already exist (run 'just tune pg01' first if they don't).

- name: Force-reset app database user passwords
  hosts: postgres_primary
  become: true
  gather_facts: false
  tasks:
    - name: Force-set passwords to current vault values
      community.postgresql.postgresql_query:
        db: postgres
        query: "ALTER ROLE {{ item.name }} WITH ENCRYPTED PASSWORD %s"
        positional_args:
          - "{{ item.password }}"
      become_user: postgres
      loop:
        - { name: mealie,   password: "{{ mealie_db_pass | trim }}" }
        - { name: freshrss, password: "{{ freshrss_db_pass | trim }}" }
        - { name: immich,   password: "{{ immich_db_pass | trim }}" }
      loop_control:
        label: "{{ item.name }}"
