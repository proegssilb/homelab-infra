[defaults]
inventory          = inventory/
roles_path         = roles
collections_paths  = galaxy
# Vault password file — gitignored. Create it locally:
#   echo "your-vault-password" > .vault-password
# Or use an env var instead:
#   ANSIBLE_VAULT_PASSWORD_FILE=~/.vault-password
vault_password_file = .vault-password

# SSH: connect as a dedicated provisioning user.
# Set the actual user/key path in host_vars or via extra vars.
remote_user  = ansible
private_key_file = ~/.ssh/id_ed25519

# Speed up connections for large inventories.
pipelining   = true
forks        = 10

[ssh_connection]
# ServerAlive* is not optional tuning. Ansible can tear down the very link it
# is connected over: the tailscale_router play installs the tailscale package,
# which restarts tailscaled and destroys the userspace-networking netstack
# proxying the SSH session. That teardown sends no FIN and no RST, so without
# keepalives ssh sits ESTABLISHED forever and the play hangs with no timeout.
# 15s x 4 = the task fails in about a minute instead of blocking a bootstrap.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4
