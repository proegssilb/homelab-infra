# Updates reboot the VM, so they happen in a nightly window, not every ~8 h.
# :stable VMs keep this 04:00 default; :canary VMs get 03:00 from cloud-init
# (/etc/systemd/system/bootc-fetch-apply-updates.timer.d/window.conf), and any VM
# can be given its own window the same way.
[Timer]
OnBootSec=
OnUnitInactiveSec=
OnCalendar=*-*-* 04:00
RandomizedDelaySec=30min
Persistent=true
