[Unit]
# cloud-init writes the site's endpoints; a VM without them (e.g. a test boot
# that doesn't set them) simply doesn't run Alloy.
ConditionPathExists=/etc/alloy/endpoints.env
# cloud-init's write_files runs in its network stage. Not cloud-final: that one
# runs after multi-user.target, which wants Alloy, so it would be an ordering cycle.
After=cloud-init-network.service

[Service]
EnvironmentFile=/etc/alloy/endpoints.env
