# Directories the packages create in /var at install time; bootc only carries
# /var over on first install, so updates rely on these entries instead.
d /var/lib/cloud      0755 root       root       -
d /var/lib/prometheus 0755 prometheus prometheus -
d /var/log/qemu-ga    0755 root       root       -

# node_exporter's textfile collector directory (same path as the Debian hosts).
d /var/lib/prometheus/node-exporter 0755 root root -

# Alloy's state (WAL, positions). bootc ships /var only at install time, so
# state directories come from here, not from the image.
d /var/lib/alloy      0700 alloy alloy -
d /var/lib/alloy/data 0770 alloy alloy -
