# Users the packages would otherwise create with whatever UID is free, which can
# differ between image builds and orphan their files in /var after an update.
# Pinned here and applied (systemd-sysusers) before the RPMs install, so the
# RPMs' own useradd / sysusers entries find them already there.
g alloy      977
u alloy      977:977 "alloy user"              /var/lib/alloy      /sbin/nologin
m alloy      systemd-journal
g prometheus 976
u prometheus 976:976 "Prometheus user account" /var/lib/prometheus /sbin/nologin
