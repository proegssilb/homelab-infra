# Proxmox hands cloud-init a NoCloud drive (or ConfigDrive); don't probe clouds
# the lab doesn't have.
datasource_list: [NoCloud, ConfigDrive, None]

# The image is immutable: cloud-init configures, it doesn't install packages.
# (User-data overrides this; Proxmox's "upgrade packages" option must be off,
# see tofu/modules/bootc_vm.)
package_update: false
package_upgrade: false

# bootc grows the root itself (bootc-generic-growpart); cloud-init can't (the root
# is composefs) and only warns.
growpart:
  mode: "off"
resize_rootfs: false
